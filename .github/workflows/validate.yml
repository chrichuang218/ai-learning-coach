name: Validate skills

env:
  CODEX_CLI_VERSION: "0.144.1"

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install validation dependency
        run: python -m pip install pyyaml

      - name: Validate repository
        run: python scripts/validate_repo.py

      - name: Test Learning Lab projections and export boundaries
        run: python -m unittest discover -s tests -v

      - name: Install MCP test dependency
        run: python -m pip install -r plugins/ai-learning-coach/mcp/requirements.txt

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Exercise MCP tools in process
        run: python scripts/mcp_demo_smoke.py

      - name: Exercise MCP tools through the Codex and Claude Code launch configs
        run: |
          python scripts/mcp_demo_smoke.py --use-config codex
          python scripts/mcp_demo_smoke.py --use-config claude

      - name: Install Codex CLI
        run: npm install --global "@openai/codex@${CODEX_CLI_VERSION}"

      - name: Smoke test marketplace installation
        run: python scripts/release_smoke.py --protocol
